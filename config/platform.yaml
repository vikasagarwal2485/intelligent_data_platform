# Intelligent Data Platform - configuration (local defaults; IDP_* environment
# variables override them in the cluster)

platform:
  name: intelligent-data-platform
  environment: local            # local (minikube) | aws (eks)

# Multi-tenancy. Every record is stamped with tenant_id and
# physically isolated by a leading partition column.
tenants:
  - id: tenant_a
    name: "Acme Telecom"
    region: eu-west-1
    pii_salt: "salt-a-CHANGE-ME"   # per-tenant salt for GDPR PII tokenization (dev only)
  - id: tenant_b
    name: "Globex Mobile"
    region: eu-central-1
    pii_salt: "salt-b-CHANGE-ME"

# Lake storage layout (local dirs; s3://<prefix>-<layer> buckets when s3.enabled)
storage:
  root: "data/lake"
  landing: "data/landing"
  bronze: "data/lake/bronze"
  silver: "data/lake/silver"
  gold: "data/lake/gold"
  ml_artifacts: "ml/artifacts"

# Kafka streaming path (produce synthetic data -> topics -> Bronze).
# Overridable via env: IDP_KAFKA_BOOTSTRAP, IDP_SCHEMA_REGISTRY.
kafka:
  bootstrap: "idp-kafka-kafka-bootstrap:9092"          # in-cluster address
  schema_registry: "http://apicurio-registry:8080/apis/ccompat/v7"
  topic_prefix: "t"                                     # topics: t.<tenant>.<entity>

# Object store for the lake. When enabled, each medallion layer goes to its own
# bucket: <bucket_prefix>-bronze / -silver / -gold (created by install-infra.sh).
# Overridable via env: IDP_S3_ENDPOINT, IDP_S3_ACCESS_KEY, IDP_S3_SECRET_KEY,
# IDP_S3_BUCKET_PREFIX.
s3:
  enabled: false                                        # true when running in-cluster
  endpoint: "http://minio:9000"
  access_key: "minioadmin"
  secret_key: "minioadmin123"
  bucket_prefix: "idp"                                  # -> idp-bronze / idp-silver / idp-gold

# Iceberg catalog for the lake (REQ-FND-04). Bronze/Silver/Gold are Iceberg tables
# in namespaces bronze/silver/gold; each table's data lives in its layer's location
# (s3://<prefix>-<layer>/tables/<table> with S3, else storage.<layer>/tables/<table>).
#   type: sql  -> Iceberg JDBC catalog shared by pyiceberg and Spark. uri is a
#                 SQLAlchemy URL: sqlite:///<path> locally/in tests (default:
#                 <storage.root>/catalog.db, no services needed), or
#                 postgresql+psycopg2://... in the cluster (the `iceberg` database on
#                 the platform TimescaleDB). Keeps full snapshot history.
#   type: rest -> an Iceberg REST catalog (not Nessie: it keeps only the current
#                 snapshot, which breaks incremental Silver; ADR-0028)
# Overridable via env: IDP_CATALOG_TYPE, IDP_CATALOG_URI.
catalog:
  type: sql
  uri: ""                          # sql: sqlite under storage.root when empty
  warehouse: ""                    # default location only; tables live in their layer
  name: ""                         # catalog name in the rows (IDP_CATALOG_NAME); empty ->
                                   # `lake` for a shared catalog, per-file for local SQLite

# Lake table maintenance and cost controls (REQ-ORC-06).
lake:
  snapshot_retention_days: 7       # expire older snapshots (never the current one)
  bronze_archive_days: 90          # move older Bronze objects to a colder tier/class
  target_file_size_mb: 128         # compaction target

# TimescaleDB (Gold serving layer). When enabled, the publish stage mirrors Gold
# tables here for low-latency serving. Overridable via env: IDP_TS_HOST,
# IDP_TS_PORT, IDP_TS_DB, IDP_TS_USER, IDP_TS_PASSWORD.
# SQL query engine for the MCP analytics tools (REQ-MCP-06/09): Trino's `lake`
# Iceberg catalog over the same JDBC catalog the stages use. The tools connect as
# the read-only analytics identity. Locally `make trino-api` port-forwards the
# cluster's Trino to 127.0.0.1:8085. Overridable via env: IDP_TRINO_HOST,
# IDP_TRINO_PORT, IDP_TRINO_USER, IDP_TRINO_CATALOG.
trino:
  host: "127.0.0.1"
  port: 8085            # `make trino-api` forwards the cluster's trino:8443 here (8080 is taken by kafka-ui/airflow)
  catalog: "lake"
  http_scheme: "https"  # Trino authenticates every request, over HTTPS only (REQ-PLT-11)
  ca_cert: "deploy/platform/trino/.secrets/tls.crt"   # written by `make trino-certs`

# The MCP server's identity (REQ-MCP-06): its tenant's Keycloak MCP client. The
# token's tenant is the only tenant the tools answer for, and Trino row-filters to
# it (REQ-TEN-03). `make mcp-config TENANT=<t>` prints the environment to set.
mcp:
  auth:
    enabled: false       # on when IDP_MCP_CLIENT_ID is set
    token_url: "http://127.0.0.1:18180/realms/idp/protocol/openid-connect/token"   # make keycloak-api
    client_id: ""        # IDP_MCP_CLIENT_ID, e.g. idp-mcp-tenant_a
    client_secret: ""    # IDP_MCP_CLIENT_SECRET
    refresh_margin_seconds: 30

timescale:
  enabled: false
  host: "timescaledb.idp-platform.svc"
  port: 5432
  database: "idp"
  user: "postgres"
  password: "idp-dev-password"     # matches deploy/platform/timescaledb/timescaledb.yaml (dev only)
  schema: "gold"

# Spark runtime for the Silver/Gold stages (single transformation engine,
# REQ-ORC-05). The execution environment only picks the master and resources:
# local[*] on a laptop / in CI / in a single-pod Job; a cluster master later.
# Overridable via env: IDP_SPARK_MASTER, IDP_SPARK_DRIVER_MEMORY.
spark:
  master: "local[*]"
  driver_memory: "1g"             # JVM heap; keep the pod limit well above it
  # Per-stage resource profiles (REQ-ORC-07). In the cluster each Spark stage runs
  # as a SparkApplication: every container's limit = memory (JVM heap) +
  # memoryOverhead (off-heap, Python workers). Executors apply only when the master
  # isn't local; `local[*]` runs (tests, `idp run`) use the driver settings alone.
  # Scale a stage by raising executor.instances (or memory); no code change. These
  # defaults are sized for a 12 GB minikube node (`make mk-check`); on EKS use e.g.
  # 2-4g executors and more instances. A profile may also set `shuffle_partitions`;
  # by default a stage uses twice its executor cores (instances x cores), or twice
  # the local cores, for every shuffle. After changing it, run
  # `make silver-full-refresh` once: streaming checkpoints keep their first value.
  profiles:
    silver:   {driver: {cores: 1, memory: 1g, memoryOverhead: 512m}, executor: {instances: 2, cores: 1, memory: 1g, memoryOverhead: 512m}}
    gold:     {driver: {cores: 1, memory: 1g, memoryOverhead: 512m}, executor: {instances: 2, cores: 1, memory: 1g, memoryOverhead: 512m}}
    score:    {driver: {cores: 1, memory: 1g, memoryOverhead: 512m}, executor: {instances: 2, cores: 1, memory: 1g, memoryOverhead: 768m}}  # pandas in Python workers
    publish:  {driver: {cores: 1, memory: 1g, memoryOverhead: 512m}, executor: {instances: 1, cores: 1, memory: 1g, memoryOverhead: 512m}}
    maintain: {driver: {cores: 1, memory: 1g, memoryOverhead: 512m}, executor: {instances: 1, cores: 1, memory: 1g, memoryOverhead: 512m}}
    train:    {driver: {cores: 1, memory: 2g, memoryOverhead: 1g}, executor: {instances: 1, cores: 1, memory: 1g, memoryOverhead: 512m}}  # join + sample on the executor; the driver collects the bounded sample and fits

# Synthetic data generation (Phase 0 - reviewer requirement)
synthetic:
  seed: 42
  subscribers_per_tenant: 500
  days: 60
  fraud_rate: 0.10             # fraction of subscribers exhibiting fraud
  default_rate: 0.12           # fraction defaulting on extended credit

# Feature engineering lookback windows (days)
features:
  windows: [7, 30, 90]

# Credit model policy
# Offline training (REQ-ML-09): fit on at most train_max_rows labelled rows, a
# stratified random sample per (tenant, label class) with a fixed seed, so training
# memory doesn't grow with the subscriber base.
ml:
  train_max_rows: 2000000
  sample_seed: 42

# TM Forum landing format (REQ-BRZ-03/06): the landing files are TMF Open API v5
# resources, mapped to and from the canonical records by this profile
# (config/tmf/profiles/<name>.yaml). `standard` = standard fields + characteristics +
# the platform extension (tenantId); a customer profile adds its own @type subtypes.
# Env: IDP_TMF_PROFILE.
tmf:
  profile: standard

# Scoring-API authentication (REQ-SRV-03). When enabled, every endpoint except
# GET /health needs a Bearer JWT from the Keycloak realm `idp`, validated against the
# realm's JWKS (signature, iss, aud, exp); the caller's tenant is the `tenant_claim`
# claim, and a body/path tenant_id that differs gets 403. Off here for local dev and
# tests; both cluster overlays set IDP_AUTH_ENABLED=true.
# Env: IDP_AUTH_ENABLED, IDP_AUTH_ISSUER, IDP_AUTH_AUDIENCE, IDP_AUTH_TENANT_CLAIM,
# IDP_AUTH_LEEWAY_SECONDS.
auth:
  enabled: false
  issuer: "http://keycloak.idp-platform.svc:8080/realms/idp"
  audience: "idp-scoring-api"
  tenant_claim: "tenant_id"
  leeway_seconds: 30

# Model registry (REQ-ML-04). With a tracking URI, `train` logs each run to MLflow,
# registers `idp-credit`/`idp-fraud` versions and moves the `champion` alias to
# versions that pass the gates below; Score and the scoring API load `champion`
# (the API re-checks it every refresh_seconds). Empty = the object-store fallback
# (s3://<prefix>-ml/*.joblib, or storage.ml_artifacts locally), latest model wins.
# Env: IDP_MLFLOW_TRACKING_URI, IDP_MLFLOW_REFRESH_SECONDS. In the cluster the workloads
# set http://mlflow.idp-platform.svc:80 (chart community-charts/mlflow 1.11.2: Service
# `mlflow` port 80 -> container 5000); from the host, `make mlflow-ui` = 127.0.0.1:5050.
mlflow:
  tracking_uri: ""
  refresh_seconds: 60
  experiment: "idp-training"

credit:
  base_multiplier: 3.0         # k in limit0 = k * avg_recharge * factors
  min_limit: 5.0
  max_limit: 500.0
  min_auc: 0.55                # promotion gate: a new version becomes `champion` only if hold-out AUC >= this

# Fraud model
fraud:
  anomaly_contamination: 0.05
  min_pr_auc_lift: 1.5         # promotion gate: hold-out PR-AUC >= this x the hold-out fraud rate
  rule_thresholds:
    originating_ratio: 0.9     # SIM-box signature
    max_calls_per_day: 200
    failed_recharge_burst: 5
