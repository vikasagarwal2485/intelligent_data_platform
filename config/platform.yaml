# Intelligent Data Platform - prototype configuration
# See docs/architecture_and_implementation_plan.md

platform:
  name: intelligent-data-platform
  environment: local            # local (minikube) | aws (eks)

# Multi-tenancy (see plan section 1.5). Every record is stamped with tenant_id and
# physically isolated by a leading partition column.
tenants:
  - id: tenant_a
    name: "Acme Telecom"
    region: eu-west-1
    pii_salt: "salt-a-CHANGE-ME"   # per-tenant salt for GDPR PII tokenization (dev only)
  - id: tenant_b
    name: "Globex Mobile"
    region: eu-central-1
    pii_salt: "salt-b-CHANGE-ME"

# Lake storage layout (s3://... in prod, local dirs in prototype)
storage:
  root: "data/lake"
  landing: "data/landing"
  bronze: "data/lake/bronze"
  silver: "data/lake/silver"
  gold: "data/lake/gold"
  ml_artifacts: "ml/artifacts"

# Kafka streaming path (produce synthetic data -> topics -> Bronze).
# Overridable via env: IDP_KAFKA_BOOTSTRAP, IDP_SCHEMA_REGISTRY.
kafka:
  bootstrap: "idp-kafka-kafka-bootstrap:9092"          # in-cluster address
  schema_registry: "http://apicurio-registry:8080/apis/ccompat/v7"
  topic_prefix: "t"                                     # topics: t.<tenant>.<entity>

# Object store for the lake. When enabled, each medallion layer goes to its own
# bucket: <bucket_prefix>-bronze / -silver / -gold (created by install-infra.sh).
# Overridable via env: IDP_S3_ENDPOINT, IDP_S3_ACCESS_KEY, IDP_S3_SECRET_KEY,
# IDP_S3_BUCKET_PREFIX.
s3:
  enabled: false                                        # true when running in-cluster
  endpoint: "http://minio:9000"
  access_key: "minioadmin"
  secret_key: "minioadmin123"
  bucket_prefix: "idp"                                  # -> idp-bronze / idp-silver / idp-gold

# Iceberg catalog for the lake (REQ-FND-04). Bronze/Silver/Gold are Iceberg tables
# in namespaces bronze/silver/gold; each table's data lives in its layer's location
# (s3://<prefix>-<layer>/tables/<table> with S3, else storage.<layer>/tables/<table>).
#   type: sql  -> Iceberg JDBC catalog shared by pyiceberg and Spark. uri is a
#                 SQLAlchemy URL: sqlite:///<path> locally/in tests (default:
#                 <storage.root>/catalog.db, no services needed), or
#                 postgresql+psycopg2://... in the cluster (the `iceberg` database on
#                 the platform TimescaleDB). Keeps full snapshot history.
#   type: rest -> an Iceberg REST catalog (not Nessie: it keeps only the current
#                 snapshot, which breaks incremental Silver; ADR-0028)
# Overridable via env: IDP_CATALOG_TYPE, IDP_CATALOG_URI.
catalog:
  type: sql
  uri: ""                          # sql: sqlite under storage.root when empty
  warehouse: ""                    # default location only; tables live in their layer

# Lake table maintenance and cost controls (REQ-ORC-06).
lake:
  snapshot_retention_days: 7       # expire older snapshots (never the current one)
  bronze_archive_days: 90          # move older Bronze objects to a colder tier/class
  target_file_size_mb: 128         # compaction target

# TimescaleDB (Gold serving layer). When enabled, the publish stage mirrors Gold
# tables here for low-latency serving. Overridable via env: IDP_TS_HOST,
# IDP_TS_PORT, IDP_TS_DB, IDP_TS_USER, IDP_TS_PASSWORD.
timescale:
  enabled: false
  host: "timescaledb.idp-platform.svc"
  port: 5432
  database: "idp"
  user: "postgres"
  password: "idp-dev-password"     # matches deploy/platform/timescaledb/timescaledb.yaml (dev only)
  schema: "gold"

# Spark runtime for the Silver/Gold stages (single transformation engine,
# REQ-ORC-05). The execution environment only picks the master and resources:
# local[*] on a laptop / in CI / in a single-pod Job; a cluster master later.
# Overridable via env: IDP_SPARK_MASTER, IDP_SPARK_DRIVER_MEMORY.
spark:
  master: "local[*]"
  driver_memory: "1g"             # JVM heap; keep the pod limit well above it

# Synthetic data generation (Phase 0 - reviewer requirement)
synthetic:
  seed: 42
  subscribers_per_tenant: 500
  days: 60
  fraud_rate: 0.10             # fraction of subscribers exhibiting fraud
  default_rate: 0.12           # fraction defaulting on extended credit

# Feature engineering lookback windows (days) - see plan section 4
features:
  windows: [7, 30, 90]

# Credit model policy (see plan section 5)
credit:
  base_multiplier: 3.0         # k in limit0 = k * avg_recharge * factors
  min_limit: 5.0
  max_limit: 500.0

# Fraud model (see plan section 6)
fraud:
  anomaly_contamination: 0.05
  rule_thresholds:
    originating_ratio: 0.9     # SIM-box signature
    max_calls_per_day: 200
    failed_recharge_burst: 5
