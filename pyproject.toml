[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "idp"
version = "0.1.0"
description = "Intelligent Data Platform - Telecom Lakehouse for alternative credit-limit scoring and fraud detection"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scikit-learn>=1.3",
    "pyarrow>=12.0",
    "pyyaml>=6.0",
    "pydantic>=2.0",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "kafka-python>=2.0",
    "s3fs>=2023.12",
    "sqlalchemy>=2.0",
    "psycopg2-binary>=2.9",
    "trino==0.340.0",                 # SQL engine client for the MCP analytics tools
    "fastjsonschema>=2.19,<3",        # TMF landing resources validated against vendored schemas (REQ-BRZ-06)
    "fastavro>=1.9,<2",               # conformed records checked against config/avro/canonical in Silver (REQ-STR-03)
    "PyJWT[crypto]>=2.8,<3",          # scoring-API JWT validation against Keycloak JWKS (REQ-SRV-03)
    "mlflow-skinny==3.14.0",          # model registry client (REQ-ML-04), = the server version
    "boto3>=1.43.3,<1.43.47",         # MLflow S3 artifacts; botocore within aiobotocore's range
    "botocore>=1.43.3,<1.43.47",
    "mcp>=1.2,<2",                    # MCP analytics server; mcp 2 renamed FastMCP to MCPServer (server.py uses v1)
    # Single transformation engine for Silver/Gold (REQ-ORC-05); matches the
    # Spark 3.5 runtime. Needs a JDK 11/17 on the host (the image bundles a JRE).
    "pyspark==3.5.3",
    # Iceberg lake tables from Python (landing, ML/serving/analytics reads); the Spark
    # side uses iceberg-spark-runtime 1.10.0 (config: transforms.session).
    "pyiceberg[sql-sqlite,sql-postgres,pyarrow,s3fs,pyiceberg-core]==0.12.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.4", "httpx>=0.27", "alembic>=1.13", "jsonschema>=4.18", "pytest-split>=0.10,<1", "bcrypt>=4,<6"]   # alembic: MLflow's sqlite registry in tests; jsonschema: the Telecom Statement 2020-12 schemas; pytest-split: CI shards; bcrypt: Trino's service-user passwords (make_secrets.py)
# SHAP-based adverse-action reason codes. Optional/heavy: when absent the credit
# model falls back to interpretable logistic-scorecard contributions.
explain = ["shap>=0.44"]

[project.scripts]
idp = "idp.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -m 'not trino'"   # `pytest -m trino` (or `make mcp-trino-test`) runs those
filterwarnings = ["ignore::DeprecationWarning"]
markers = [
    "postgres: needs a real PostgreSQL/TimescaleDB (set IDP_TEST_POSTGRES_URL); skipped otherwise",
    "trino: needs the compose Trino stack (deploy/dev/trino-compose.yaml); run with `make mcp-trino-test`",
]
