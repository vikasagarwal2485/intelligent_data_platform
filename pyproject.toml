[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "idp"
version = "0.1.0"
description = "Intelligent Data Platform - Telecom Lakehouse for alternative credit-limit scoring and fraud detection"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scikit-learn>=1.3",
    "pyarrow>=12.0",
    "pyyaml>=6.0",
    "pydantic>=2.0",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "kafka-python>=2.0",
    "s3fs>=2023.12",
    "sqlalchemy>=2.0",
    "psycopg2-binary>=2.9",
    "mcp>=1.2",
]

[project.optional-dependencies]
dev = ["pytest>=7.4", "httpx>=0.27"]
# SHAP-based adverse-action reason codes. Optional/heavy: when absent the credit
# model falls back to interpretable logistic-scorecard contributions.
explain = ["shap>=0.44"]

[project.scripts]
idp = "idp.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]
