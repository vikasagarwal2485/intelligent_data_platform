# Rendered by `idp spark-manifest maintain` from spark.profiles.maintain in
# config/platform.yaml. Don't edit by hand: `make spark-manifests` re-renders.
apiVersion: sparkoperator.k8s.io/v1beta2
kind: SparkApplication
metadata:
  name: idp-maintain
  namespace: idp-app
  labels:
    app: idp-medallion
    stage: maintain
spec:
  type: Python
  pythonVersion: '3'
  mode: cluster
  image: idp/scoring-api:dev
  imagePullPolicy: Never
  mainApplicationFile: local:///app/pipelines/spark/maintain_job.py
  arguments: []
  sparkVersion: 3.5.3
  restartPolicy:
    type: Never
  timeToLiveSeconds: 3600
  driver:
    cores: 1
    memory: 1g
    memoryOverhead: 512m
    serviceAccount: idp-spark
    labels:
      app: idp-medallion
      stage: maintain
    env:
    - name: IDP_S3_ENDPOINT
      value: http://minio.idp-platform.svc:9000
    - name: IDP_S3_ACCESS_KEY
      value: minioadmin
    - name: IDP_S3_SECRET_KEY
      value: minioadmin123
    - name: IDP_S3_BUCKET_PREFIX
      value: idp
    - name: IDP_CATALOG_TYPE
      value: sql
    - name: IDP_CATALOG_URI
      value: postgresql+psycopg2://postgres:idp-dev-password@timescaledb.idp-platform.svc:5432/iceberg
    - name: IDP_SPARK_MASTER
      value: k8s://https://kubernetes.default.svc:443
  executor:
    instances: 1
    cores: 1
    memory: 1g
    memoryOverhead: 512m
    labels:
      app: idp-medallion
      stage: maintain
    env:
    - name: IDP_S3_ENDPOINT
      value: http://minio.idp-platform.svc:9000
    - name: IDP_S3_ACCESS_KEY
      value: minioadmin
    - name: IDP_S3_SECRET_KEY
      value: minioadmin123
    - name: IDP_S3_BUCKET_PREFIX
      value: idp
    - name: IDP_CATALOG_TYPE
      value: sql
    - name: IDP_CATALOG_URI
      value: postgresql+psycopg2://postgres:idp-dev-password@timescaledb.idp-platform.svc:5432/iceberg
    - name: IDP_SPARK_MASTER
      value: k8s://https://kubernetes.default.svc:443
