# On-demand Silver stage (idp-app): reads Bronze from MinIO, writes Silver.
# Independent of the consumer — run it whenever Bronze has new data.
#
# Apply:  kubectl -n idp-app apply -f deploy/jobs/silver-job.yaml
apiVersion: batch/v1
kind: Job
metadata:
  name: idp-silver
  namespace: idp-app
  labels: { app: idp-medallion, stage: silver }
spec:
  backoffLimit: 2
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels: { app: idp-medallion, stage: silver }
    spec:
      restartPolicy: Never
      containers:
        - name: silver
          image: idp/scoring-api:dev
          imagePullPolicy: Never
          command: ["idp", "silver"]
          env:
            - name: IDP_S3_ENDPOINT
              value: "http://minio.idp-platform.svc:9000"
            - name: IDP_S3_ACCESS_KEY
              value: "minioadmin"
            - name: IDP_S3_SECRET_KEY
              value: "minioadmin123"
            - name: IDP_S3_BUCKET_PREFIX
              value: "idp"
          resources:
            requests: { cpu: "250m", memory: 1Gi }
            limits: { cpu: "1", memory: 2Gi }
