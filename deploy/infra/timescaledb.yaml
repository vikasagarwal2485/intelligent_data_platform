# TimescaleDB (Gold serving layer, plan Q6) using the official, freely-pullable
# timescale/timescaledb image - avoids the Bitnami free-catalogue limitation.
# Apply with:  kubectl apply -n idp-platform -f deploy/infra/timescaledb.yaml
apiVersion: v1
kind: Secret
metadata:
  name: timescaledb
  labels: { app: timescaledb }
type: Opaque
stringData:
  POSTGRES_PASSWORD: "idp-dev-password"   # dev only; use External Secrets on EKS
  POSTGRES_DB: "idp"
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: timescaledb-data
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: timescaledb
  labels: { app: timescaledb }
spec:
  replicas: 1
  selector:
    matchLabels: { app: timescaledb }
  template:
    metadata:
      labels: { app: timescaledb }
    spec:
      containers:
        - name: timescaledb
          image: timescale/timescaledb:2.17.2-pg16   # Docker Hub, free
          envFrom:
            - secretRef:
                name: timescaledb
          ports:
            - containerPort: 5432
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "postgres"]
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests: { cpu: "250m", memory: 512Mi }
            limits: { cpu: "1", memory: 1Gi }
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: timescaledb-data
---
apiVersion: v1
kind: Service
metadata:
  name: timescaledb
spec:
  selector: { app: timescaledb }
  ports:
    - port: 5432
      targetPort: 5432
