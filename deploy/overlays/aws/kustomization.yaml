apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# AWS (EKS) overlay: production image from ECR, IRSA service account for S3.
resources:
  - ../../base

patches:
  - target:
      kind: Deployment
      name: scoring-api
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 3
      - op: replace
        path: /spec/template/spec/containers/0/image
        value: <ACCOUNT>.dkr.ecr.<REGION>.amazonaws.com/idp/scoring-api:latest
      - op: add
        path: /spec/template/spec/serviceAccountName
        value: scoring-api-irsa
