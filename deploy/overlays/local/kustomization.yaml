apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Local (minikube) overlay: small footprint, single scoring-api replica.
resources:
  - ../../base

patches:
  - target:
      kind: Deployment
      name: scoring-api
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
      - op: replace
        path: /spec/template/spec/containers/0/image
        value: idp/scoring-api:dev
