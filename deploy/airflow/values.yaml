# Airflow Helm values: bake the IDP DAGs into a local image + install the k8s provider.
#
# Apply on install/upgrade (see `make airflow-wire`, which also creates the
# `airflow` metadata database in TimescaleDB first):
#   helm upgrade --install airflow apache-airflow/airflow -n idp-platform \
#     --version 1.15.0 -f deploy/airflow/values.yaml --timeout 15m
#
# Pin to chart 1.15.0 (Airflow 2.9.3). Newer charts ship Airflow 3.x, which
# renames the UI component `webserver` -> `api-server` (service becomes
# airflow-api-server, not airflow-webserver) and changes these value keys — so
# `make airflow-ui`/`airflow-trigger` would break. The 2.x line keeps the
# `webserver`, `triggerer` and `dagProcessor` keys below valid.
#
# The DAGs are BAKED into a local image (deploy/airflow/Dockerfile), not pulled
# via git-sync: the source repo is private, so git-sync-init can't clone it
# without credentials and crashloops with an auth error. The DAGs use
# KubernetesPodOperator, so Airflow needs the cncf.kubernetes provider (bundled
# in the official image) and the RBAC in deploy/airflow/rbac.yaml.

executor: KubernetesExecutor

# --- DAG image --------------------------------------------------------------
# Use the locally built image with DAGs baked in (built into minikube by
# `make airflow-wire`). pullPolicy: Never so the cluster never reaches a registry.
airflowVersion: "2.9.3"
images:
  airflow:
    repository: idp/airflow
    tag: dev
    pullPolicy: Never

# --- Metadata database ------------------------------------------------------
# The Airflow chart bundles a Bitnami PostgreSQL subchart by default. Bitnami's
# free image catalogue was retired, so that subchart's image no longer pulls and
# the DB (and therefore the `run-airflow-migrations` job) hangs forever. We
# disable it and reuse the TimescaleDB already deployed in idp-platform as the
# metadata store (a dedicated `airflow` database — created by `make airflow-wire`
# before the Helm install; separate from the `idp` serving database).
postgresql:
  enabled: false

# KubernetesExecutor does not need Celery/Redis; disable the bundled Redis so it
# doesn't try to pull a Bitnami image either.
redis:
  enabled: false

data:
  metadataConnection:
    user: postgres
    pass: idp-dev-password
    protocol: postgresql
    host: timescaledb.idp-platform.svc
    port: 5432
    db: airflow
    sslmode: disable

# Trim optional components the demo doesn't use — fewer pods to schedule and no
# extra init containers to wait on migrations.
triggerer:
  enabled: false
dagProcessor:
  enabled: false
statsd:
  enabled: false
flower:
  enabled: false

dags:
  # DAGs are baked into the image above (/opt/airflow/dags), not synced from git.
  gitSync:
    enabled: false
  persistence:
    enabled: false

# Keep the demo light on a small node.
workers:
  resources:
    requests: { cpu: 250m, memory: 512Mi }
    limits: { cpu: 1, memory: 1Gi }
scheduler:
  resources:
    requests: { cpu: 250m, memory: 512Mi }
    limits: { cpu: 1, memory: 1Gi }
webserver:
  resources:
    requests: { cpu: 250m, memory: 512Mi }
    limits: { cpu: 1, memory: 1Gi }
