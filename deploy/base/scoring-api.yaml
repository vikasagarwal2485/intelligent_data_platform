# The FastAPI scoring service (plan 5.6 / 6.6). Stateless; loads models from the
# shared ml-artifacts volume / object store.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: scoring-api
  namespace: idp-platform
  labels:
    app: scoring-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: scoring-api
  template:
    metadata:
      labels:
        app: scoring-api
    spec:
      containers:
        - name: scoring-api
          image: ghcr.io/idp/scoring-api:latest   # built in CI, pushed to ECR/GHCR
          command: ["idp", "serve", "--host", "0.0.0.0", "--port", "8000"]
          ports:
            - containerPort: 8000
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: "250m"
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: scoring-api
  namespace: idp-platform
spec:
  selector:
    app: scoring-api
  ports:
    - port: 80
      targetPort: 8000
