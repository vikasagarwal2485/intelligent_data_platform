# The FastAPI scoring service (plan 5.6 / 6.6). Stateless; serves the model
# registry's `champion` versions (MLflow, IDP_MLFLOW_TRACKING_URI below; artifacts in
# s3://idp-ml/mlflow via the IDP_S3_* env) and re-checks the champion every
# mlflow.refresh_seconds, so a newly promoted model is served without a restart.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: scoring-api
  namespace: idp-app
  labels:
    app: scoring-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: scoring-api
  template:
    metadata:
      labels:
        app: scoring-api
    spec:
      containers:
        - name: scoring-api
          image: ghcr.io/idp/scoring-api:latest   # built in CI, pushed to ECR/GHCR
          command: ["idp", "serve", "--host", "0.0.0.0", "--port", "8000"]
          env:
            # Model store (MinIO). On EKS these are overridden for real S3 + IRSA.
            - name: IDP_S3_ENDPOINT
              value: "http://minio.idp-platform.svc:9000"
            - name: IDP_S3_ACCESS_KEY
              value: "minioadmin"
            - name: IDP_S3_SECRET_KEY
              value: "minioadmin123"
            - name: IDP_S3_BUCKET_PREFIX
              value: "idp"
            # Model registry (REQ-ML-04): MLflow in idp-platform; artifacts use the S3 env above
            - name: IDP_MLFLOW_TRACKING_URI
              value: "http://mlflow.idp-platform.svc:80"
            # the lake's Iceberg catalog (REQ-FND-04): JDBC on the platform Postgres
            # (database `iceberg`; dev credentials, use External Secrets on EKS)
            - name: IDP_CATALOG_TYPE
              value: "sql"
            - name: IDP_CATALOG_URI
              value: "postgresql+psycopg2://postgres:idp-dev-password@timescaledb.idp-platform.svc:5432/iceberg"
          ports:
            - containerPort: 8000
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: "250m"
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: scoring-api
  namespace: idp-app
spec:
  selector:
    app: scoring-api
  ports:
    - port: 80
      targetPort: 8000
