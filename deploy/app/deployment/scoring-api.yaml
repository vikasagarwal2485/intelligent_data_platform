# The FastAPI scoring service (plan 5.6 / 6.6). Stateless; loads the trained
# models from the MinIO/S3 model store (s3://idp-ml) via the IDP_S3_* env below,
# so it shares one artifact store with the train and Gold jobs.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: scoring-api
  namespace: idp-app
  labels:
    app: scoring-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: scoring-api
  template:
    metadata:
      labels:
        app: scoring-api
    spec:
      containers:
        - name: scoring-api
          image: ghcr.io/idp/scoring-api:latest   # built in CI, pushed to ECR/GHCR
          command: ["idp", "serve", "--host", "0.0.0.0", "--port", "8000"]
          env:
            # Model store (MinIO). On EKS these are overridden for real S3 + IRSA.
            - name: IDP_S3_ENDPOINT
              value: "http://minio.idp-platform.svc:9000"
            - name: IDP_S3_ACCESS_KEY
              value: "minioadmin"
            - name: IDP_S3_SECRET_KEY
              value: "minioadmin123"
            - name: IDP_S3_BUCKET_PREFIX
              value: "idp"
          ports:
            - containerPort: 8000
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: "250m"
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: scoring-api
  namespace: idp-app
spec:
  selector:
    app: scoring-api
  ports:
    - port: 80
      targetPort: 8000
