apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Application base: the scoring-api service (idp-app namespace). This is the
# environment-agnostic Deployment/Service; the image, replicas and pull policy
# are patched per environment by the overlays in deploy/app/overlays/{local,aws}.
resources:
  - scoring-api.yaml

commonLabels:
  app.kubernetes.io/part-of: intelligent-data-platform
