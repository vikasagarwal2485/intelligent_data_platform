# Seed the labels/outcomes store (idp-app): writes ground-truth labels
# (is_fraud / will_default / true_credit_limit, tokenized) to s3://idp-ml/labels.
# Simulates the business's observed-outcomes table that the train job joins to
# Gold features. Kept OUTSIDE the Gold/serving path (no leakage). Run before train.
#
# Apply:  kubectl -n idp-app apply -f deploy/app/jobs/labels-job.yaml
apiVersion: batch/v1
kind: Job
metadata:
  name: idp-labels
  namespace: idp-app
  labels: { app: idp-medallion, stage: labels }
spec:
  backoffLimit: 2
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels: { app: idp-medallion, stage: labels }
    spec:
      restartPolicy: Never
      containers:
        - name: labels
          image: idp/scoring-api:dev
          imagePullPolicy: Never
          command: ["idp", "labels"]
          env:
            # MUST MATCH produce-job.yaml's IDP_SUBSCRIBERS/IDP_DAYS. Labels are
            # regenerated deterministically from these params; if they differ from
            # the data that produced Gold, the tokenized service_ids won't match and
            # the training join is empty. Keep these two jobs in lock-step.
            - name: IDP_SUBSCRIBERS
              value: "150"
            - name: IDP_DAYS
              value: "14"
            - name: IDP_S3_ENDPOINT
              value: "http://minio.idp-platform.svc:9000"
            - name: IDP_S3_ACCESS_KEY
              value: "minioadmin"
            - name: IDP_S3_SECRET_KEY
              value: "minioadmin123"
            - name: IDP_S3_BUCKET_PREFIX
              value: "idp"
          resources:
            requests: { cpu: "250m", memory: 512Mi }
            limits: { cpu: "1", memory: 2Gi }
