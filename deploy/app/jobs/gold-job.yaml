# On-demand Gold stage (idp-app): reads Silver from MinIO, builds feature tables
# (and scores if trained models are available), writes Gold.
#
# Apply:  kubectl -n idp-app apply -f deploy/jobs/gold-job.yaml
apiVersion: batch/v1
kind: Job
metadata:
  name: idp-gold
  namespace: idp-app
  labels: { app: idp-medallion, stage: gold }
spec:
  backoffLimit: 2
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels: { app: idp-medallion, stage: gold }
    spec:
      restartPolicy: Never
      containers:
        - name: gold
          image: idp/scoring-api:dev
          imagePullPolicy: Never
          command: ["idp", "gold"]
          env:
            - name: IDP_S3_ENDPOINT
              value: "http://minio.idp-platform.svc:9000"
            - name: IDP_S3_ACCESS_KEY
              value: "minioadmin"
            - name: IDP_S3_SECRET_KEY
              value: "minioadmin123"
            - name: IDP_S3_BUCKET_PREFIX
              value: "idp"
          resources:
            requests: { cpu: "250m", memory: 1Gi }
            limits: { cpu: "1", memory: 2Gi }
