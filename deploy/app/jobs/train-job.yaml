# On-demand offline training (idp-app): fits the credit + fraud models on the
# labelled synthetic dataset (labels never enter the lake — ADR-0014) and writes
# the model artifacts to the MinIO model store (s3://idp-ml) so the Gold job and
# the scoring API can load them. Run before `make gold` if you want scores.
#
# Apply:  kubectl -n idp-app apply -f deploy/app/jobs/train-job.yaml
apiVersion: batch/v1
kind: Job
metadata:
  name: idp-train
  namespace: idp-app
  labels: { app: idp-medallion, stage: train }
spec:
  backoffLimit: 2
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels: { app: idp-medallion, stage: train }
    spec:
      restartPolicy: Never
      containers:
        - name: train
          image: idp/scoring-api:dev
          imagePullPolicy: Never
          command: ["idp", "train"]
          env:
            - name: IDP_S3_ENDPOINT
              value: "http://minio.idp-platform.svc:9000"
            - name: IDP_S3_ACCESS_KEY
              value: "minioadmin"
            - name: IDP_S3_SECRET_KEY
              value: "minioadmin123"
            - name: IDP_S3_BUCKET_PREFIX
              value: "idp"
            # Model registry (REQ-ML-04): MLflow in idp-platform; artifacts use the S3 env above
            - name: IDP_MLFLOW_TRACKING_URI
              value: "http://mlflow.idp-platform.svc:80"
            # the lake's Iceberg catalog (REQ-FND-04): JDBC on the platform Postgres
            # (database `iceberg`; dev credentials, use External Secrets on EKS)
            - name: IDP_CATALOG_TYPE
              value: "sql"
            - name: IDP_CATALOG_URI
              value: "postgresql+psycopg2://postgres:idp-dev-password@timescaledb.idp-platform.svc:5432/iceberg"
          resources:
            requests: { cpu: "250m", memory: 1Gi }
            limits: { cpu: "1", memory: 3Gi }
