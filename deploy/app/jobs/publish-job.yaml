# On-demand Serving stage (idp-app): reads Gold from MinIO, publishes it to
# TimescaleDB for low-latency serving (plan Q4/Q6).
#
# Apply:  kubectl -n idp-app apply -f deploy/jobs/publish-job.yaml
apiVersion: batch/v1
kind: Job
metadata:
  name: idp-publish
  namespace: idp-app
  labels: { app: idp-medallion, stage: serving }
spec:
  backoffLimit: 2
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels: { app: idp-medallion, stage: serving }
    spec:
      restartPolicy: Never
      containers:
        - name: publish
          image: idp/scoring-api:dev
          imagePullPolicy: Never
          command: ["idp", "publish"]
          env:
            # Gold source (MinIO)
            - name: IDP_S3_ENDPOINT
              value: "http://minio.idp-platform.svc:9000"
            - name: IDP_S3_ACCESS_KEY
              value: "minioadmin"
            - name: IDP_S3_SECRET_KEY
              value: "minioadmin123"
            - name: IDP_S3_BUCKET_PREFIX
              value: "idp"
            # the lake's Iceberg catalog (REQ-FND-04): JDBC on the platform Postgres
            # (database `iceberg`; dev credentials, use External Secrets on EKS)
            - name: IDP_CATALOG_TYPE
              value: "sql"
            - name: IDP_CATALOG_URI
              value: "postgresql+psycopg2://postgres:idp-dev-password@timescaledb.idp-platform.svc:5432/iceberg"
            # Serving target (TimescaleDB)
            - name: IDP_TS_HOST
              value: "timescaledb.idp-platform.svc"
            - name: IDP_TS_PORT
              value: "5432"
            - name: IDP_TS_DB
              value: "idp"
            - name: IDP_TS_USER
              value: "postgres"
            - name: IDP_TS_PASSWORD
              value: "idp-dev-password"
          resources:
            requests: { cpu: "250m", memory: 512Mi }
            limits: { cpu: "1", memory: 1Gi }
