# Source landing (idp-app): synthetic source files -> s3://idp-landing (REQ-BRZ-03).
# First step of `make stream-from-landing`: generate -> produce --from-landing -> consume.
# Writes one tenant at a time, like the produce Job, so it fits the same memory.
---
apiVersion: batch/v1
kind: Job
metadata:
  name: idp-generate
  namespace: idp-app
  labels: { app: idp-streaming }
spec:
  backoffLimit: 2
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels: { app: idp-streaming }
    spec:
      restartPolicy: Never
      containers:
        - name: generate
          image: idp/scoring-api:dev
          imagePullPolicy: Never          # use the image built into minikube
          command: ["idp", "generate"]
          env:
            - name: IDP_S3_ENDPOINT
              value: "http://minio.idp-platform.svc:9000"
            - name: IDP_S3_ACCESS_KEY
              value: "minioadmin"
            - name: IDP_S3_SECRET_KEY
              value: "minioadmin123"
            - name: IDP_S3_BUCKET_PREFIX
              value: "idp"
            # MUST MATCH produce-job.yaml and labels-job.yaml: labels are regenerated
            # from these params and must line up with the data that becomes Gold.
            # Keep these three jobs in lock-step.
            - name: IDP_SUBSCRIBERS
              value: "150"
            - name: IDP_DAYS
              value: "14"
          resources:
            requests: { cpu: "250m", memory: 1Gi }
            limits: { cpu: "1", memory: 2Gi }
