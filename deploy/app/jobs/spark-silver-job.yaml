# Production Silver stage as a Spark job (spark-submit), run as a one-off K8s Job.
#
# Runs pipelines/spark/silver_job.py in local[*] mode inside a single Spark pod,
# reading Bronze and writing Silver on MinIO via the S3A connector. The script is
# mounted from a ConfigMap (created by `make spark-configmap`).
#
# --salts carries the per-tenant PII salts so tokens match the pandas Silver path
# exactly. These are DEV salts (config/platform.yaml); source them from a Secret
# on EKS. Needs egress to fetch the hadoop-aws jars (via --packages) the first time.
apiVersion: batch/v1
kind: Job
metadata:
  name: idp-spark-silver
  namespace: idp-app
  labels: { app: idp-medallion, stage: silver, engine: spark }
spec:
  backoffLimit: 1
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels: { app: idp-medallion, stage: silver, engine: spark }
    spec:
      restartPolicy: Never
      containers:
        - name: spark-silver
          image: apache/spark:3.5.3          # bundles Spark + PySpark + Hadoop 3.3.4
          env:
            - name: HOME
              value: /tmp                    # writable home for the Ivy cache
          command: ["/opt/spark/bin/spark-submit"]
          args:
            - "--master"
            - "local[*]"
            - "--packages"
            - "org.apache.hadoop:hadoop-aws:3.3.4"
            - "--conf"
            - "spark.jars.ivy=/tmp/.ivy2"
            - "--conf"
            - "spark.hadoop.fs.s3a.endpoint=http://minio.idp-platform.svc:9000"
            - "--conf"
            - "spark.hadoop.fs.s3a.access.key=minioadmin"
            - "--conf"
            - "spark.hadoop.fs.s3a.secret.key=minioadmin123"
            - "--conf"
            - "spark.hadoop.fs.s3a.path.style.access=true"
            - "--conf"
            - "spark.hadoop.fs.s3a.connection.ssl.enabled=false"
            - "/opt/idp/silver_job.py"
            - "--prefix"
            - "idp"
            - "--salts"
            - "tenant_a=salt-a-CHANGE-ME,tenant_b=salt-b-CHANGE-ME"
          volumeMounts:
            - name: job-script
              mountPath: /opt/idp
          resources:
            requests: { cpu: "500m", memory: 1500Mi }
            limits: { cpu: "2", memory: 2500Mi }
      volumes:
        - name: job-script
          configMap:
            name: idp-silver-spark      # created from pipelines/spark/silver_job.py
