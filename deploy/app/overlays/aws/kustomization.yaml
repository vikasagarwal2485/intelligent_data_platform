apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# App overlay (EKS): production image from ECR, IRSA service account for S3,
# three replicas. Synced by the Argo CD application (deploy/platform/argocd).
# Requires the platform base (namespaces/RBAC) to be applied first.
resources:
  - ../../deployment

patches:
  - target:
      kind: Deployment
      name: scoring-api
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 3
      - op: replace
        path: /spec/template/spec/containers/0/image
        value: <ACCOUNT>.dkr.ecr.<REGION>.amazonaws.com/idp/scoring-api:latest
      - op: add
        path: /spec/template/spec/serviceAccountName
        value: scoring-api-irsa
      # Authentication is always on in a cluster (REQ-SRV-03): the production
      # Keycloak's realm `idp` over TLS (Postgres-backed, HA; not the dev pod).
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value: {name: IDP_AUTH_ENABLED, value: "true"}
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value: {name: IDP_AUTH_ISSUER, value: "https://<KEYCLOAK_HOST>/realms/idp"}
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value: {name: IDP_AUTH_AUDIENCE, value: "idp-scoring-api"}
