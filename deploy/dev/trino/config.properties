# The test stack's coordinator config: the cluster's authentication settings
# (deploy/platform/trino/trino-values.yaml, REQ-PLT-11) with one difference: tokens
# are verified with the test key pair (deploy/platform/trino/make_secrets.py
# --test-jwt), not the Keycloak realm's keys. The secrets are generated into
# deploy/dev/trino/.secrets by `make trino-stack`.
coordinator=true
node-scheduler.include-coordinator=true
http-server.http.port=8080
discovery.uri=http://localhost:8080
http-server.authentication.type=JWT,PASSWORD
http-server.authentication.jwt.key-file=/etc/trino/auth/jwt-public.pem
http-server.authentication.jwt.required-issuer=https://idp-test.invalid/realms/idp
http-server.authentication.jwt.required-audience=trino
http-server.authentication.jwt.principal-field=idp_principal
http-server.https.enabled=true
http-server.https.port=8443
http-server.https.keystore.path=/etc/trino/auth/trino.pem
internal-communication.shared-secret=${ENV:TRINO_SHARED_SECRET}
