apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Platform base: cluster-scoped scaffolding shared by the local (minikube) and
# AWS (EKS) platform overlays — namespaces, RBAC, and tenant isolation. The
# scoring-api application is deployed separately from deploy/app/overlays
# (`make app-deploy`), not from here.
resources:
  - namespaces.yaml
  - rbac.yaml
  - isolation.yaml

commonLabels:
  app.kubernetes.io/part-of: intelligent-data-platform
