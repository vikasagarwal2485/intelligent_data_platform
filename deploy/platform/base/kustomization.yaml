apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Platform base: cluster-scoped scaffolding shared by the local (minikube) and
# AWS (EKS) overlays — namespaces, RBAC, and tenant isolation. The scoring-api
# application lives in deploy/app/deployment (pulled in by the overlays).
resources:
  - namespaces.yaml
  - rbac.yaml
  - isolation.yaml

commonLabels:
  app.kubernetes.io/part-of: intelligent-data-platform
