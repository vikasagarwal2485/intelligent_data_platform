# Namespaces:
#  * idp-platform : shared platform services (Kafka, MinIO, Trino, Nessie, ...)
#  * idp-app      : application workloads (scoring API, streaming jobs)
#  * idp-tenant-* : per-tenant compute isolation (plan 1.5)
apiVersion: v1
kind: Namespace
metadata:
  name: idp-platform
  labels:
    app.kubernetes.io/part-of: intelligent-data-platform
    idp.io/scope: platform
---
apiVersion: v1
kind: Namespace
metadata:
  name: idp-app
  labels:
    app.kubernetes.io/part-of: intelligent-data-platform
    idp.io/scope: application
---
apiVersion: v1
kind: Namespace
metadata:
  name: idp-tenant-a
  labels:
    app.kubernetes.io/part-of: intelligent-data-platform
    idp.io/scope: tenant
    idp.io/tenant: tenant_a
---
apiVersion: v1
kind: Namespace
metadata:
  name: idp-tenant-b
  labels:
    app.kubernetes.io/part-of: intelligent-data-platform
    idp.io/scope: tenant
    idp.io/tenant: tenant_b
