# Grafana dashboard (auto-loaded by the kube-prometheus-stack Grafana sidecar,
# which watches ConfigMaps labelled grafana_dashboard=1 in all namespaces).
apiVersion: v1
kind: ConfigMap
metadata:
  name: idp-grafana-dashboard-cluster
  labels:
    grafana_dashboard: "1"
data:
  idp-cluster.json: |
    {
      "annotations": {
        "list": []
      },
      "editable": true,
      "graphTooltip": 1,
      "schemaVersion": 39,
      "version": 1,
      "time": {
        "from": "now-30m",
        "to": "now"
      },
      "refresh": "30s",
      "templating": {
        "list": []
      },
      "tags": [
        "idp",
        "kubernetes"
      ],
      "title": "IDP \u2014 Kubernetes Cluster Overview",
      "uid": "idp-k8s-cluster",
      "panels": [
        {
          "id": 1,
          "type": "timeseries",
          "title": "Node CPU used %",
          "datasource": "Prometheus",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 0
          },
          "fieldConfig": {
            "defaults": {
              "unit": "percent",
              "custom": {
                "drawStyle": "line",
                "fillOpacity": 10
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom"
            },
            "tooltip": {
              "mode": "multi"
            }
          },
          "targets": [
            {
              "refId": "A",
              "datasource": "Prometheus",
              "expr": "100 - (avg(rate(node_cpu_seconds_total{mode=\"idle\"}[5m])) * 100)",
              "legendFormat": "cpu %"
            }
          ]
        },
        {
          "id": 2,
          "type": "timeseries",
          "title": "Node memory used %",
          "datasource": "Prometheus",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 0
          },
          "fieldConfig": {
            "defaults": {
              "unit": "percent",
              "custom": {
                "drawStyle": "line",
                "fillOpacity": 10
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom"
            },
            "tooltip": {
              "mode": "multi"
            }
          },
          "targets": [
            {
              "refId": "A",
              "datasource": "Prometheus",
              "expr": "(1 - (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)) * 100",
              "legendFormat": "mem %"
            }
          ]
        },
        {
          "id": 3,
          "type": "stat",
          "title": "Running pods",
          "datasource": "Prometheus",
          "gridPos": {
            "h": 6,
            "w": 6,
            "x": 0,
            "y": 8
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short"
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            },
            "colorMode": "value"
          },
          "targets": [
            {
              "refId": "A",
              "datasource": "Prometheus",
              "expr": "sum(kube_pod_status_phase{phase=\"Running\"})"
            }
          ]
        },
        {
          "id": 4,
          "type": "timeseries",
          "title": "Pods by namespace",
          "datasource": "Prometheus",
          "gridPos": {
            "h": 8,
            "w": 18,
            "x": 6,
            "y": 8
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "custom": {
                "drawStyle": "line",
                "fillOpacity": 10
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom"
            },
            "tooltip": {
              "mode": "multi"
            }
          },
          "targets": [
            {
              "refId": "A",
              "datasource": "Prometheus",
              "expr": "sum by (namespace) (kube_pod_info)",
              "legendFormat": "{{namespace}}"
            }
          ]
        }
      ]
    }
