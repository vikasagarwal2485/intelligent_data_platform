# Kafka admin UI (Kafbat UI - the maintained successor to provectus/kafka-ui).
# Browse/create/configure topics, view messages, and inspect the schema registry.
# Wired to the Strimzi cluster's internal plain listener and Apicurio's
# Confluent-compatible API.
#
# Apply:   kubectl apply -n idp-platform -f deploy/kafka/kafka-ui.yaml
# Access:  kubectl -n idp-platform port-forward svc/kafka-ui 8080:8080
#          open http://localhost:8080
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kafka-ui
  labels:
    app: kafka-ui
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kafka-ui
  template:
    metadata:
      labels:
        app: kafka-ui
    spec:
      containers:
        - name: kafka-ui
          image: ghcr.io/kafbat/kafka-ui:latest
          ports:
            - containerPort: 8080
          env:
            - name: DYNAMIC_CONFIG_ENABLED
              value: "true"
            - name: KAFKA_CLUSTERS_0_NAME
              value: "idp"
            # Strimzi internal plain listener (port 9092, tls disabled)
            - name: KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS
              value: "idp-kafka-kafka-bootstrap:9092"
            # Apicurio Registry Confluent-compatible endpoint
            - name: KAFKA_CLUSTERS_0_SCHEMAREGISTRY
              value: "http://apicurio-registry:8080/apis/ccompat/v7"
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 10
          resources:
            requests: { cpu: "100m", memory: 256Mi }
            limits: { cpu: "500m", memory: 768Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: kafka-ui
  labels:
    app: kafka-ui
spec:
  selector:
    app: kafka-ui
  ports:
    - port: 8080
      targetPort: 8080
