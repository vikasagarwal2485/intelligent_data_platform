# Single-node Apache Kafka cluster managed by the Strimzi operator (KRaft mode).
# The entityOperator.topicOperator lets us manage topics declaratively via
# KafkaTopic CRs. For production raise replicas and use persistent storage.
#
# Strimzi API notes (v1 + KafkaNodePool):
#  * Broker sizing (resources / storage / replicas) lives on the KafkaNodePool,
#    NOT on Kafka.spec.kafka (that field was removed and is strict-rejected).
#  * spec.kafka.version must be one your operator supports. Check with:
#      kubectl -n idp-platform get kafka idp-kafka -o jsonpath='{.status.conditions}'
#    (an unsupported version reports the supported list in the NotReady message).
apiVersion: kafka.strimzi.io/v1
kind: KafkaNodePool
metadata:
  name: dual-role
  labels:
    strimzi.io/cluster: idp-kafka
spec:
  replicas: 1
  roles:
    - controller
    - broker
  storage:
    type: ephemeral
  # Keep the broker small so it fits a local minikube node (avoids OOM/Pending).
  # With a memory limit set and no explicit -Xmx, Strimzi auto-sizes the JVM heap.
  resources:
    requests:
      cpu: "250m"
      memory: "1Gi"
    limits:
      cpu: "1"
      memory: "1536Mi"
---
apiVersion: kafka.strimzi.io/v1
kind: Kafka
metadata:
  name: idp-kafka
  annotations:
    strimzi.io/node-pools: enabled
    strimzi.io/kraft: enabled
spec:
  kafka:
    # Must be a version supported by the installed operator. Strimzi 1.1.x
    # supports Kafka 4.2.0 / 4.2.1 / 4.3.0.
    version: 4.3.0
    listeners:
      - name: plain
        port: 9092
        type: internal
        tls: false
      - name: tls
        port: 9093
        type: internal
        tls: true
    config:
      # single-broker friendly replication settings
      offsets.topic.replication.factor: 1
      transaction.state.log.replication.factor: 1
      transaction.state.log.min.isr: 1
      default.replication.factor: 1
      min.insync.replicas: 1
    # Expose broker JMX as Prometheus metrics on the "tcp-prometheus" port (9404)
    # for the Kafka produce/consume dashboard (REQ-PLT-08). Rules live in the
    # kafka-metrics ConfigMap, applied by setup-kafka.sh before this CR.
    metricsConfig:
      type: jmxPrometheusExporter
      valueFrom:
        configMapKeyRef:
          name: kafka-metrics
          key: kafka-metrics-config.yml
  # Kafka Exporter adds consumer-group lag / offset metrics (the "consume" side).
  kafkaExporter:
    topicRegex: ".*"
    groupRegex: ".*"
  entityOperator:
    topicOperator: {}
    userOperator: {}
