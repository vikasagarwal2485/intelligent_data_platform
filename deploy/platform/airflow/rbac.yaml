# Let Airflow launch stage pods in the idp-app namespace (KubernetesPodOperator).
# Airflow runs in idp-platform; its pods must be able to create/watch/delete pods
# in idp-app.
#
# NOTE: set the ServiceAccount name to match your Airflow chart. The
# apache-airflow chart commonly uses "airflow-worker" (KubernetesExecutor) and
# "airflow-scheduler". Check with:
#   kubectl -n idp-platform get sa | grep airflow
# then edit the subjects below if needed.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: idp-pod-launcher
  namespace: idp-app
rules:
  - apiGroups: [""]
    resources: ["pods", "pods/log", "pods/exec"]
    verbs: ["create", "get", "list", "watch", "delete", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: idp-pod-launcher
  namespace: idp-app
subjects:
  - kind: ServiceAccount
    name: airflow-worker
    namespace: idp-platform
  - kind: ServiceAccount
    name: airflow-scheduler
    namespace: idp-platform
roleRef:
  kind: Role
  name: idp-pod-launcher
  apiGroup: rbac.authorization.k8s.io
---
# The Spark stages run as SparkApplications (REQ-PLT-10): Airflow's
# SparkKubernetesOperator creates them in idp-app, watches them to their final
# state, and deletes them afterwards.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: idp-spark-submitter
  namespace: idp-app
rules:
  - apiGroups: ["sparkoperator.k8s.io"]
    resources: ["sparkapplications", "sparkapplications/status"]
    verbs: ["create", "get", "list", "watch", "delete", "patch", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: idp-spark-submitter
  namespace: idp-app
subjects:
  - kind: ServiceAccount
    name: airflow-worker
    namespace: idp-platform
  - kind: ServiceAccount
    name: airflow-scheduler
    namespace: idp-platform
roleRef:
  kind: Role
  name: idp-spark-submitter
  apiGroup: rbac.authorization.k8s.io
