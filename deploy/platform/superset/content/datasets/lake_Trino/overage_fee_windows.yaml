table_name: overage_fee_windows
main_dttm_col: charged_at
currency_code_column: null
description: Silver overage fee charges with 7-day windows, measured back from the latest overage charge
default_endpoint: null
offset: 0
cache_timeout: null
catalog: lake
schema: silver
sql: "SELECT f.tenant_id, f.category, f.product_name, f.amount, f.currency, f.charged_at,\n       CASE\
  \ WHEN f.charged_at > l.latest - INTERVAL '7' DAY THEN 'last_7d'\n            WHEN f.charged_at > l.latest\
  \ - INTERVAL '14' DAY THEN 'prior_7d' END AS period\nFROM silver.fact_fee_charge f\nCROSS JOIN (SELECT\
  \ max(charged_at) AS latest FROM silver.fact_fee_charge WHERE charge_type = 'overage') l\nWHERE f.charge_type\
  \ = 'overage'\n"
