table_name: usage_windows
main_dttm_col: started_at
currency_code_column: null
description: Silver usage events with 7-day and 30-day windows, measured back from the latest event
default_endpoint: null
offset: 0
cache_timeout: null
catalog: lake
schema: silver
sql: "SELECT u.tenant_id, u.event_type, u.traffic_case, u.unit, u.is_roaming, u.qty, u.started_at,\n \
  \      CASE WHEN u.started_at > l.latest - INTERVAL '7' DAY THEN 'last_7d'\n            WHEN u.started_at\
  \ > l.latest - INTERVAL '14' DAY THEN 'prior_7d' END AS period,\n       u.started_at > l.latest - INTERVAL\
  \ '30' DAY AS in_last_30d\nFROM silver.fact_usage u\nCROSS JOIN (SELECT max(started_at) AS latest FROM\
  \ silver.fact_usage) l\n"
