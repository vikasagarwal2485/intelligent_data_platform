# Trino tuned for a small local (minikube) cluster.
#
# Why pods OOMKill / CrashLoop with the defaults:
#  * the chart defaults to an 8G JVM heap and 2 worker pods -> too big for a
#    small node;
#  * Trino uses a LOT of off-heap memory (direct buffers, GC, metaspace), so the
#    container memory LIMIT must sit well ABOVE -Xmx. If limit ~= heap, the
#    kernel OOM-kills the container.
#
# This config: coordinator-only (no workers), a 768M heap, and a 1536Mi limit
# (~768Mi of off-heap headroom) so the JVM can't exceed the cgroup limit. The MCP
# tools' queries are single-tenant aggregates, and the 12 GB minikube node must
# still fit the largest Spark stage with Trino running (`make mk-check`).
#
# The `lake` catalog and the access rules live in their own files, shared with the
# compose test stack (deploy/dev/trino-compose.yaml), and are passed as --set-file:
#   deploy/platform/trino/lake.properties -> catalogs.lake
#   deploy/platform/trino/rules.json      -> accessControl.rules."rules.json"
#
# Apply/upgrade (does all of the above):
#   make trino-fix          # bash deploy/platform/trino-tune.sh idp-platform

server:
  workers: 0          # coordinator-only; removes the worker pods entirely
  config:
    # Every request is authenticated (REQ-PLT-11): Keycloak access tokens for tenant
    # principals (JWT), passwords for the service users admin and superset. Both
    # need HTTPS; plain HTTP on 8080 serves only the probes (/v1/info).
    authenticationType: "JWT,PASSWORD"
    https:
      enabled: true
      port: 8443
      keystore:
        path: /etc/trino/tls/trino.pem      # key + certificate, from the trino-tls Secret

# Coordinator also executes tasks (needed when workers=0); keep query memory
# safely below (heap - heap-headroom) so a query can't push the JVM past -Xmx.
additionalConfigProperties:
  - node-scheduler.include-coordinator=true
  - query.max-memory-per-node=256MB
  - memory.heap-headroom-per-node=192MB
  # Tokens are verified against the realm's published keys; the user is the token's
  # idp_principal claim (<name>@<tenant>), which the row filter reads (REQ-TEN-03).
  - http-server.authentication.jwt.key-file=http://keycloak.idp-platform.svc:8080/realms/idp/protocol/openid-connect/certs
  - http-server.authentication.jwt.required-issuer=http://keycloak.idp-platform.svc:8080/realms/idp
  - http-server.authentication.jwt.required-audience=trino
  - http-server.authentication.jwt.principal-field=idp_principal
  - internal-communication.shared-secret=${ENV:TRINO_SHARED_SECRET}

# The authentication material, created by `make trino-certs` (deploy/platform/trino/certs.sh):
auth:
  passwordAuthSecret: trino-auth           # password.db -> /etc/trino/auth/password/
secretMounts:
  - name: trino-tls
    secretName: trino-tls
    path: /etc/trino/tls
envFrom:
  - secretRef:
      name: trino-internal                 # TRINO_SHARED_SECRET

# The lake's Iceberg JDBC catalog (REQ-PLT-11): `catalogs.lake` comes from
# lake.properties. The chart's sample catalogs are dropped.
catalogs:
  tpch: null
  tpcds: null

# The endpoints and credentials lake.properties reads (${ENV:...}); the secrets come
# from the platform's timescaledb and minio Secrets.
env:
  - name: LAKE_CATALOG_URL
    value: jdbc:postgresql://timescaledb.idp-platform.svc:5432/iceberg
  - name: LAKE_CATALOG_USER
    value: postgres
  - name: LAKE_CATALOG_PASSWORD
    valueFrom: { secretKeyRef: { name: timescaledb, key: POSTGRES_PASSWORD } }
  - name: LAKE_S3_ENDPOINT
    value: http://minio.idp-platform.svc:9000
  - name: LAKE_S3_ACCESS_KEY
    valueFrom: { secretKeyRef: { name: minio, key: rootUser } }
  - name: LAKE_S3_SECRET_KEY
    valueFrom: { secretKeyRef: { name: minio, key: rootPassword } }

# File-based access control (rules.json): tenant principals (<name>@<tenant>) may
# only SELECT from lake.silver and lake.gold, row-filtered to their tenant and with
# Iceberg metadata tables denied; `superset` may only impersonate tenant
# principals; `admin` may do anything; every other user nothing (REQ-TEN-03).
accessControl:
  type: configmap
  refreshPeriod: 60s
  configFile: rules.json      # rules.json comes from deploy/platform/trino/rules.json

coordinator:
  jvm:
    maxHeapSize: "768M"        # -Xmx; keep it ~50% of the memory limit
  resources:
    requests:
      cpu: "500m"
      memory: "1Gi"
    limits:
      cpu: "2"
      memory: "1536Mi"         # ~768Mi headroom above the heap for off-heap use
  livenessProbe:
    initialDelaySeconds: 60
    periodSeconds: 15
    timeoutSeconds: 10
    failureThreshold: 6
  readinessProbe:
    initialDelaySeconds: 30
    periodSeconds: 15
    timeoutSeconds: 10
    failureThreshold: 12

# Sized identically in case workers are ever enabled (server.workers > 0);
# harmless while workers=0.
worker:
  jvm:
    maxHeapSize: "1G"
  resources:
    requests:
      cpu: "500m"
      memory: "1500Mi"
    limits:
      cpu: "2"
      memory: "2Gi"
  livenessProbe:
    initialDelaySeconds: 60
    periodSeconds: 15
    timeoutSeconds: 10
    failureThreshold: 6
  readinessProbe:
    initialDelaySeconds: 30
    periodSeconds: 15
    timeoutSeconds: 10
    failureThreshold: 12
