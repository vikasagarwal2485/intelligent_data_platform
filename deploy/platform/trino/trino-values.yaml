# Trino tuned for a small local (minikube) cluster.
#
# Why pods OOMKill / CrashLoop with the defaults:
#  * the chart defaults to an 8G JVM heap and 2 worker pods -> too big for a
#    small node;
#  * Trino uses a LOT of off-heap memory (direct buffers, GC, metaspace), so the
#    container memory LIMIT must sit well ABOVE -Xmx. If limit ~= heap, the
#    kernel OOM-kills the container.
#
# This config: coordinator-only (no workers), a modest 1G heap, and a 2Gi limit
# (~1Gi of off-heap headroom) so the JVM can't exceed the cgroup limit.
#
# Apply/upgrade:
#   helm upgrade --install trino trino/trino -n idp-platform -f deploy/trino-values.yaml

server:
  workers: 0          # coordinator-only; removes the worker pods entirely

# Coordinator also executes tasks (needed when workers=0); keep query memory
# safely below (heap - heap-headroom) so a query can't push the JVM past -Xmx.
additionalConfigProperties:
  - node-scheduler.include-coordinator=true
  - query.max-memory-per-node=400MB
  - memory.heap-headroom-per-node=256MB

coordinator:
  jvm:
    maxHeapSize: "1G"          # -Xmx; keep it ~50% of the memory limit
  resources:
    requests:
      cpu: "500m"
      memory: "1500Mi"
    limits:
      cpu: "2"
      memory: "2Gi"            # ~1Gi headroom above the heap for off-heap use
  livenessProbe:
    initialDelaySeconds: 60
    periodSeconds: 15
    timeoutSeconds: 10
    failureThreshold: 6
  readinessProbe:
    initialDelaySeconds: 30
    periodSeconds: 15
    timeoutSeconds: 10
    failureThreshold: 12

# Sized identically in case workers are ever enabled (server.workers > 0);
# harmless while workers=0.
worker:
  jvm:
    maxHeapSize: "1G"
  resources:
    requests:
      cpu: "500m"
      memory: "1500Mi"
    limits:
      cpu: "2"
      memory: "2Gi"
  livenessProbe:
    initialDelaySeconds: 60
    periodSeconds: 15
    timeoutSeconds: 10
    failureThreshold: 6
  readinessProbe:
    initialDelaySeconds: 30
    periodSeconds: 15
    timeoutSeconds: 10
    failureThreshold: 12
