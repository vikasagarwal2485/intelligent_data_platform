# The `lake` catalog: Trino's view of the lake's Iceberg JDBC catalog (REQ-PLT-11).
# The same catalog rows (catalog name `lake`, the `iceberg` Postgres database) and
# table metadata that Spark and pyiceberg commit, so Trino sees every table's
# current snapshot; the `bronze`, `silver` and `gold` namespaces are its schemas.
#
# One file for both stacks. The endpoints and credentials come from the
# environment: the Helm values set them from the timescaledb and minio Secrets;
# deploy/dev/trino-compose.yaml sets them for the compose Postgres and MinIO.
# Installed with `make trino-fix` (helm --set-file catalogs.lake=...).
connector.name=iceberg
iceberg.catalog.type=jdbc
iceberg.jdbc-catalog.driver-class=org.postgresql.Driver
iceberg.jdbc-catalog.connection-url=${ENV:LAKE_CATALOG_URL}
iceberg.jdbc-catalog.connection-user=${ENV:LAKE_CATALOG_USER}
iceberg.jdbc-catalog.connection-password=${ENV:LAKE_CATALOG_PASSWORD}
iceberg.jdbc-catalog.catalog-name=lake
# the default location only; tables keep their per-layer locations (s3://idp-<layer>/tables/<t>)
iceberg.jdbc-catalog.default-warehouse-dir=s3://idp-bronze
fs.native-s3.enabled=true
s3.endpoint=${ENV:LAKE_S3_ENDPOINT}
s3.region=us-east-1
s3.path-style-access=true
s3.aws-access-key=${ENV:LAKE_S3_ACCESS_KEY}
s3.aws-secret-key=${ENV:LAKE_S3_SECRET_KEY}
