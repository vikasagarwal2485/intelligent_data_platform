# Keycloak (identity / RBAC) using the official quay.io image in dev
# mode (H2, start-dev) - free to pull, suited to the local cluster. For EKS,
# switch to a production chart with an external DB and TLS.
#
# The realm `idp` (REQ-SRV-03) is imported at every start from the ConfigMap
# `keycloak-realm` (deploy/platform/keycloak/idp-realm.json): the dev store is
# in-container H2, so the import re-applies after each restart.
# Apply with:  make keycloak   (creates the ConfigMap from the JSON, applies this,
#                               and restarts the pod so the realm is re-imported)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: keycloak
  labels: { app: keycloak }
spec:
  replicas: 1
  selector:
    matchLabels: { app: keycloak }
  template:
    metadata:
      labels: { app: keycloak }
    spec:
      containers:
        - name: keycloak
          image: quay.io/keycloak/keycloak:26.0   # quay.io, free
          args: ["start-dev", "--import-realm"]
          env:
            - name: KEYCLOAK_ADMIN
              value: "admin"
            - name: KEYCLOAK_ADMIN_PASSWORD
              value: "admin"               # dev only; use External Secrets on EKS
            - name: KC_HEALTH_ENABLED
              value: "true"
            # Tokens carry this issuer however they are requested (in-cluster, or
            # through `make keycloak-token`'s port-forward), so `iss` always matches
            # the scoring API's IDP_AUTH_ISSUER.
            - name: KC_HOSTNAME
              value: "http://keycloak.idp-platform.svc:8080"
            # Cap the JVM so total RSS (heap + metaspace + code cache + direct
            # buffers) stays under the memory limit. Without this the Quarkus JVM
            # sizes its heap at ~70% of the cgroup limit and the rest pushes the
            # container past the limit -> OOMKilled (exit 137). ~50% heap leaves
            # room for everything else on a small node.
            - name: JAVA_OPTS_APPEND
              value: "-XX:MaxRAMPercentage=50.0 -XX:MaxMetaspaceSize=256m"
          ports:
            - containerPort: 8080
            - containerPort: 9000   # management/health port
          # Keycloak start-dev can take 1-2 min to boot (more on a slow node);
          # the startupProbe gives it up to ~5 min before liveness/readiness apply.
          startupProbe:
            httpGet:
              path: /health/ready
              port: 9000
            initialDelaySeconds: 20
            periodSeconds: 10
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 9000
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health/live
              port: 9000
            periodSeconds: 15
            failureThreshold: 5
          volumeMounts:
            - name: realm
              mountPath: /opt/keycloak/data/import
              readOnly: true
          resources:
            requests: { cpu: "250m", memory: 768Mi }
            limits: { cpu: "1", memory: 1536Mi }
      volumes:
        - name: realm
          configMap:
            name: keycloak-realm
---
apiVersion: v1
kind: Service
metadata:
  name: keycloak
spec:
  selector: { app: keycloak }
  ports:
    - port: 8080
      targetPort: 8080
