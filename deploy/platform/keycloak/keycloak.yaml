# Keycloak (identity / RBAC, plan 1.5) using the official quay.io image in dev
# mode (H2, start-dev) - free to pull, fine for a local prototype. For EKS,
# switch to a production chart with an external DB and TLS.
# Apply with:  kubectl apply -n idp-platform -f deploy/infra/keycloak.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: keycloak
  labels: { app: keycloak }
spec:
  replicas: 1
  selector:
    matchLabels: { app: keycloak }
  template:
    metadata:
      labels: { app: keycloak }
    spec:
      containers:
        - name: keycloak
          image: quay.io/keycloak/keycloak:26.0   # quay.io, free
          args: ["start-dev"]
          env:
            - name: KEYCLOAK_ADMIN
              value: "admin"
            - name: KEYCLOAK_ADMIN_PASSWORD
              value: "admin"               # dev only; use External Secrets on EKS
            - name: KC_HEALTH_ENABLED
              value: "true"
          ports:
            - containerPort: 8080
            - containerPort: 9000   # management/health port
          # Keycloak start-dev can take 1-2 min to boot (more on a slow node);
          # the startupProbe gives it up to ~5 min before liveness/readiness apply.
          startupProbe:
            httpGet:
              path: /health/ready
              port: 9000
            initialDelaySeconds: 20
            periodSeconds: 10
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 9000
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health/live
              port: 9000
            periodSeconds: 15
            failureThreshold: 5
          resources:
            requests: { cpu: "250m", memory: 768Mi }
            limits: { cpu: "1", memory: 1536Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: keycloak
spec:
  selector: { app: keycloak }
  ports:
    - port: 8080
      targetPort: 8080
