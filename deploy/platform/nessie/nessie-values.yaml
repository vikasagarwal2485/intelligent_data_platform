# Nessie (Iceberg catalog) tuned for a small local cluster.
#
# Why it crashes with defaults:
#  * newer Nessie charts can default the version store to a mode that needs an
#    external database -> the pod crashes on startup without one;
#  * the default memory limit can be too small for the Quarkus JVM -> OOM.
#
# This pins an in-memory version store (Nessie catalogues none of the lake's
# tables, ADR-0028, so nothing is lost on restart) and gives it enough memory.
#
# Apply/upgrade:
#   helm upgrade --install nessie nessie/nessie -n idp-platform -f deploy/nessie-values.yaml

versionStoreType: IN_MEMORY

resources:
  requests:
    cpu: "200m"
    memory: "512Mi"
  limits:
    cpu: "1"
    memory: "1Gi"

# Give the JVM time to start before health checks fail on a slow node.
livenessProbe:
  initialDelaySeconds: 60
  periodSeconds: 15
  timeoutSeconds: 10
  failureThreshold: 6
readinessProbe:
  initialDelaySeconds: 30
  periodSeconds: 15
  timeoutSeconds: 10
  failureThreshold: 12
