# Argo CD GitOps applications (plan 2B). Two Applications mirror the deploy split:
# the platform team owns the base (namespaces/RBAC/isolation); the app team owns
# the scoring-api workload. Platform base is in an earlier sync-wave so its
# namespaces exist before the app is applied.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: idp-platform-base
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: default
  source:
    repoURL: https://github.com/vikasagarwal2485/intelligent_data_platform.git
    targetRevision: main
    path: deploy/platform/overlays/aws
  destination:
    server: https://kubernetes.default.svc
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: idp-app
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: default
  source:
    repoURL: https://github.com/vikasagarwal2485/intelligent_data_platform.git
    targetRevision: main
    path: deploy/app/overlays/aws
  destination:
    server: https://kubernetes.default.svc
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
