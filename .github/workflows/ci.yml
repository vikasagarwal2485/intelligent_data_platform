name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  SPARK_LOCAL_IP: 127.0.0.1
  IDP_SPARK_MASTER: local[2]
  OMP_NUM_THREADS: "2"
  OPENBLAS_NUM_THREADS: "2"

jobs:
  workspace:
    name: Workspace checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version-file: .python-version
      - name: Install check dependencies
        run: python -m pip install 'PyYAML>=6.0' 'packaging>=23'
      - name: Check workspace
        run: |
          make check PY=python
          git diff --check
      - name: Validate Compose configuration
        run: docker compose -f deploy/dev/trino-compose.yaml config --quiet

  test:
    name: Tests and PostgreSQL publish
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: idp-ci-password
          POSTGRES_DB: idp_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d idp_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 30
    env:
      IDP_TEST_POSTGRES_URL: postgresql+psycopg2://postgres:idp-ci-password@127.0.0.1:5432/idp_test
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements.txt
            requirements-dev.txt
      # Silver/Gold run on Spark (REQ-ORC-05): pyspark needs a JDK.
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'
          python -m pip check
      - name: Run tests
        run: make test PY=python

  # The MCP tools against a real Trino (REQ-MCP-09): the compose stack from
  # deploy/dev/trino-compose.yaml, a lake built through the real stages, and parity
  # with the pandas reference. The default job above excludes the `trino` marker.
  mcp-trino:
    name: MCP Trino integration
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      IDP_REQUIRE_TRINO_TESTS: "1"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements.txt
            requirements-dev.txt
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'
          python -m pip check
      - name: Trino integration tests
        # starts the stack (docker compose up --wait), then pytest -m trino
        run: make mcp-trino-test PY=python
      - name: Compose logs on failure
        if: failure()
        run: docker compose -f deploy/dev/trino-compose.yaml logs --no-color --tail 200
      - name: Stop disposable integration stack
        if: always()
        run: docker compose -f deploy/dev/trino-compose.yaml down --volumes --remove-orphans
