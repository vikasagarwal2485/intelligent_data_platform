name: CI

on:
  push:
    branches: ["**"]
  pull_request:

# A newer push to the same branch or PR cancels the run it supersedes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The suite runs Spark stages end to end, so it is split into parallel shards,
  # balanced by the recorded test durations in .test_durations (pytest-split).
  # Refresh that file after adding slow tests:
  #   pytest --store-durations --durations-path .test_durations
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        group: [1, 2, 3]
    name: test (shard ${{ matrix.group }}/3)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      # Silver/Gold run on Spark (REQ-ORC-05): pyspark needs a JDK.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      # The Iceberg/S3 jars Spark fetches from Maven on first use (transforms/session.py)
      - uses: actions/cache@v4
        with:
          path: ~/.ivy2
          key: ivy-${{ hashFiles('src/idp/transforms/session.py') }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Run tests
        run: pytest --splits 3 --group ${{ matrix.group }} --durations-path .test_durations

  # The MCP tools against a real Trino (REQ-MCP-09): the compose stack from
  # deploy/dev/trino-compose.yaml, a lake built through the real stages, and parity
  # with the pandas reference. The default job above excludes the `trino` marker.
  mcp-trino:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/cache@v4
        with:
          path: ~/.ivy2
          key: ivy-${{ hashFiles('src/idp/transforms/session.py') }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Trino integration tests
        # starts the stack (docker compose up --wait), then pytest -m trino
        run: make mcp-trino-test PY=python
      - name: Trino logs on failure
        if: failure()
        run: docker compose -f deploy/dev/trino-compose.yaml logs --tail 200 trino
